<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Marketing Calendar Pro - Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #16a34a;
            --warning: #d97706;
            --border-color: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
        }

        header {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .cloud-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--success);
            background: #f0fdf4;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #bbf7d0;
        }

        .controls-bar {
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--bg-color);
            border-color: var(--text-secondary);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fee2e2;
        }

        .view-switch {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }

        .view-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .view-btn.active {
            background: var(--card-bg);
            color: var(--accent);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .main-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .calendar-day-header {
            background: #f8fafc;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .calendar-cell {
            background: var(--card-bg);
            min-height: 110px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calendar-cell:hover {
            background: #f8fafc;
        }

        .calendar-cell.other-month {
            opacity: 0.4;
            background: #fafafa;
        }

        .calendar-cell.today {
            background: #eff6ff;
        }

        .cell-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .event-chip {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        /* List / Week / Day view adjustments for full text */
        .list-view-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .list-item-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 15px;
        }

        .list-item-desc {
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .list-item-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-calendar-days" style="color: var(--accent);"></i> მარკეტინგული კალენდარი</h1>
                <p>სრული მენეჯმენტი და ღრუბლოვანი სინქრონიზაცია</p>
            </div>
            <div class="cloud-status">
                <i class="fa-solid fa-cloud-arrow-up"></i> ბაზა დაკავშირებულია
            </div>
        </header>

        <div class="controls-bar">
            <div class="nav-group">
                <button class="btn" onclick="changePeriod(-1)"><i class="fa-solid fa-chevron-left"></i> წინა</button>
                <button class="btn" onclick="goToday()">დღეს</button>
                <button class="btn" onclick="changePeriod(1)">შემდეგი <i class="fa-solid fa-chevron-right"></i></button>
                <h2 id="currentMonthYear" style="font-size: 18px; font-weight: 600; margin-left: 10px;"></h2>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="view-switch">
                    <button class="view-btn active" onclick="switchView('month')">თვე</button>
                    <button class="view-btn" onclick="switchView('week')">კვირა</button>
                    <button class="view-btn" onclick="switchView('day')">დღე</button>
                </div>
                <button class="btn btn-primary" onclick="openModalForAdd()"><i class="fa-solid fa-plus"></i> ახალი აქცია</button>
            </div>
        </div>

        <div class="main-content" id="mainContainer">
            <!-- კალენდარი ან სია აისახება აქ -->
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">აქციის დამატება</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <input type="hidden" id="eventId">
            <div class="form-group">
                <label>დასახელება / თემა</label>
                <input type="text" id="eventTitle" class="form-control" placeholder="მაგ: B2S აქცია...">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>თარიღი</label>
                    <input type="date" id="eventDate" class="form-control">
                </div>
                <div class="form-group">
                    <label>დრო</label>
                    <input type="time" id="eventTime" class="form-control" value="00:00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>კატეგორია</label>
                    <select id="eventCategory" class="form-control">
                        <option value="კამპანია">კამპანია</option>
                        <option value="სოც-ქსელი">სოც-ქსელი</option>
                        <option value="ღონისძიება">ღონისძიება</option>
                        <option value="სხვა">სხვა</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ფერი</label>
                    <select id="eventColor" class="form-control">
                        <option value="#2563eb">ლურჯი</option>
                        <option value="#16a34a">მწვანე</option>
                        <option value="#d97706">ნარინჯისფერი</option>
                        <option value="#dc2626">წითელი</option>
                        <option value="#9333ea">იისფერი</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>სრული აღწერა / დეტალები</label>
                <textarea id="eventDesc" class="form-control" placeholder="ჩაწერეთ სრული ინფორმაცია..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">გაუქმება</button>
                <button class="btn btn-primary" onclick="saveEvent()">შენახვა</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-hnsAEikkXOQ9dQFEP55Cbr5t7fGGPAMk",
            authDomain: "marketing-calendar-1a193.firebaseapp.com",
            projectId: "marketing-calendar-1a193",
            storageBucket: "marketing-calendar-1a193.firebasestorage.app",
            messagingSenderId: "448467919677",
            appId: "1:448467919677:web:47b3ae4e9d00ee669d9b54"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentView = 'month';
        let currentDate = new Date();
        let events = [];

        window.loadEventsFromCloud = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "events"));
                events = [];
                querySnapshot.forEach((docSnap) => {
                    events.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderCalendar();
            } catch (e) {
                console.error("ბაზიდან წაკითხვის შეცდომა: ", e);
            }
        };

        window.saveEventToCloud = async function(eventData) {
            try {
                await setDoc(doc(db, "events", eventData.id), eventData);
                loadEventsFromCloud();
            } catch (e) {
                console.error("შენახვის შეცდომა: ", e);
            }
        };

        window.deleteEventFromCloud = async function(id) {
            if (confirm("ნამდვილად გსურთ წაშლა?")) {
                try {
                    await deleteDoc(doc(db, "events", id));
                    loadEventsFromCloud();
                } catch (e) {
                    console.error("წაშლის შეცდომა: ", e);
                }
            }
        };

        window.switchView = function(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderCalendar();
        };

        window.changePeriod = function(direction) {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + direction);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + direction);
            }
            renderCalendar();
        };

        window.goToday = function() {
            currentDate = new Date();
            renderCalendar();
        };

        // Keyboard arrow navigation
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('eventModal').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') {
                changePeriod(-1);
            } else if (e.key === 'ArrowRight') {
                changePeriod(1);
            }
        });

        window.renderCalendar = function() {
            const container = document.getElementById('mainContainer');
            const titleEl = document.getElementById('currentMonthYear');
            container.innerHTML = '';

            const months = ['იანვარი', 'თებერვალი', 'მარტი', 'აპრილი', 'მაისი', 'ივნისი', 'ივლისი', 'აგვისტო', 'სექტემბერი', 'ოქტომბერი', 'ნოემბერი', 'დეკემბერი'];

            if (currentView === 'month') {
                titleEl.innerText = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
                
                let gridHTML = `<div class="calendar-grid">
                    <div class="calendar-day-header">ორშ</div>
                    <div class="calendar-day-header">სამ</div>
                    <div class="calendar-day-header">ოთხ</div>
                    <div class="calendar-day-header">ხუთ</div>
                    <div class="calendar-day-header">პარ</div>
                    <div class="calendar-day-header">შაბ</div>
                    <div class="calendar-day-header">კვ</div>`;

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevTotalDays = new Date(year, month, 0).getDate();

                let todayStr = new Date().toISOString().split('T')[0];

                // Previous month trailing days
                for (let i = firstDayIndex; i > 0; i--) {
                    let d = prevTotalDays - i + 1;
                    gridHTML += `<div class="calendar-cell other-month"><div class="cell-number">${d}</div></div>`;
                }

                // Current month days
                for (let i = 1; i <= totalDays; i++) {
                    let mStr = String(month + 1).padStart(2, '0');
                    let dStr = String(i).padStart(2, '0');
                    let dateString = `${year}-${mStr}-${dStr}`;
                    let isToday = (dateString === todayStr) ? 'today' : '';

                    let dayEvents = events.filter(e => e.date === dateString);
                    let eventsHTML = dayEvents.map(ev => `
                        <div class="event-chip" style="background: ${ev.color || '#2563eb'}15; color: ${ev.color || '#2563eb'}; border: 1px solid ${ev.color || '#2563eb'}40;" onclick="event.stopPropagation(); openModalForEdit('${ev.id}')" title="${ev.title}">
                            <span>[${ev.time || '00:00'}] ${ev.title}</span>
                            <i class="fa-solid fa-pen-to-square" style="font-size: 10px;"></i>
                        </div>
                    `).join('');

                    gridHTML += `<div class="calendar-cell ${isToday}" onclick="openModalForAddWithDate('${dateString}')">
                        <div class="cell-number">${i}</div>
                        <div style="display:flex; flex-direction:column; gap:4px; overflow-y:auto; max-height:80px;">${eventsHTML}</div>
                    </div>`;
                }

                gridHTML += `</div>`;
                container.innerHTML = gridHTML;

            } else if (currentView === 'week') {
                let startOfWeek = new Date(currentDate);
                let day = startOfWeek.getDay();
                let diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
                startOfWeek.setDate(diff);

                titleEl.innerText = `კვირა: ${startOfWeek.getDate()} ${months[startOfWeek.getMonth()]} - დან`;

                let listHTML = `<div class="list-view-container"><h3>კვირის სრული აქტივობები</h3>`;
                let found = false;

                for (let i = 0; i < 7; i++) {
                    let d = new Date(startOfWeek);
                    d.setDate(d.getDate() + i);
                    let dStr = d.toISOString().split('T')[0];

                    let dayEvents = events.filter(e => e.date === dStr);
                    dayEvents.forEach(ev => {
                        found = true;
                        listHTML += `
                            <div class="list-item">
                                <div class="list-item-content">
                                    <div style="font-size:12px; font-weight:600; color:var(--accent);">${dStr} [${ev.time || '00:00'}] (${ev.category})</div>
                                    <div class="list-item-title">${ev.title}</div>
                                    <div class="list-item-desc">${ev.desc || 'აღწერა არ არის'}</div>
                                </div>
                                <div class="list-item-actions">
                                    <button class="btn" onclick="openModalForEdit('${ev.id}')"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-danger" onclick="deleteEventFromCloud('${ev.id}')"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>`;
                    });
                }

                if (!found) listHTML += `<p style="color:var(--text-secondary); text-align:center; padding:20px;">ამ კვირაში ჩანაწერები არ არის.</p>`;
                listHTML += `</div>`;
                container.innerHTML = listHTML;

            } else if (currentView === 'day') {
                let dStr = currentDate.toISOString().split('T')[0];
                titleEl.innerText = `დღე: ${dStr}`;

                let dayEvents = events.filter(e => e.date === dStr);
                let listHTML = `<div class="list-view-container"><h3>დღის სრული აქტივობები (${dStr})</h3>`;

                if (dayEvents.length === 0) {
                    listHTML += `<p style="color:var(--text-secondary); text-align:center; padding:20px;">ამ დღეს ჩანაწერები არ არის.</p>`;
                } else {
                    dayEvents.forEach(ev => {
                        listHTML += `
                            <div class="list-item">
                                <div class="list-item-content">
                                    <div style="font-size:12px; font-weight:600; color:var(--accent);">[${ev.time || '00:00'}] (${ev.category})</div>
                                    <div class="list-item-title">${ev.title}</div>
                                    <div class="list-item-desc">${ev.desc || 'აღწერა არ არის'}</div>
                                </div>
                                <div class="list-item-actions">
                                    <button class="btn" onclick="openModalForEdit('${ev.id}')"><i class="fa-solid fa-pen"></i></button>
                                    <button class="btn btn-danger" onclick="deleteEventFromCloud('${ev.id}')"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>`;
                    });
                }
                listHTML += `</div>`;
                container.innerHTML = listHTML;
            }
        };

        window.openModalForAdd = function() {
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('eventTime').value = '00:00';
            document.getElementById('eventDesc').value = '';
            document.getElementById('modalTitle').innerText = 'აქციის დამატება';
            document.getElementById('eventModal').classList.add('active');
        };

        window.openModalForAddWithDate = function(dateStr) {
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = dateStr;
            document.getElementById('eventTime').value = '00:00';
            document.getElementById('eventDesc').value = '';
            document.getElementById('modalTitle').innerText = 'აქციის დამატება';
            document.getElementById('eventModal').classList.add('active');
        };

        window.openModalForEdit = function(id) {
            let ev = events.find(item => item.id === id);
            if (!ev) return;
            document.getElementById('eventId').value = ev.id;
            document.getElementById('eventTitle').value = ev.title || '';
            document.getElementById('eventDate').value = ev.date || '';
            document.getElementById('eventTime').value = ev.time || '00:00';
            document.getElementById('eventCategory').value = ev.category || 'კამპანია';
            document.getElementById('eventColor').value = ev.color || '#2563eb';
            document.getElementById('eventDesc').value = ev.desc || '';
            document.getElementById('modalTitle').innerText = 'აქციის რედაქტირება';
            document.getElementById('eventModal').classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('eventModal').classList.remove('active');
        };

        window.saveEvent = function() {
            let id = document.getElementById('eventId').value;
            if (!id) {
                id = 'event_' + Date.now();
            }
            let title = document.getElementById('eventTitle').value;
            let date = document.getElementById('eventDate').value;
            let time = document.getElementById('eventTime').value;
            let category = document.getElementById('eventCategory').value;
            let color = document.getElementById('eventColor').value;
            let desc = document.getElementById('eventDesc').value;

            if (!title || !date) {
                alert('გთხოვთ შეავსოთ დასახელება და თარიღი!');
                return;
            }

            saveEventToCloud({ id, title, date, time, category, color, desc });
            closeModal();
        };

        loadEventsFromCloud();
    </script>
</body>
</html>
